<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>SeaRover</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--ink:#14202b;--mute:#5b6b78;--acc:#0b5f7a;--bad:#b3261e}
  @media (prefers-color-scheme:dark){:root{--bg:#0f161c;--card:#18222b;--ink:#e6edf2;--mute:#9aabb8;--acc:#5fb3cf;--bad:#f2b8b5}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
  .card{width:100%;max-width:360px;background:var(--card);border-radius:14px;padding:28px 24px;
        box-shadow:0 2px 16px rgba(0,0,0,.08)}
  h1{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
  p{margin:0 0 20px;color:var(--mute);font-size:14px}
  label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  input[type=password]{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid #9aabb880;
        background:transparent;color:inherit}
  .row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--mute)}
  button{width:100%;font:600 16px system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--acc);
         color:#fff;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--bad)}
  #msg.ok{color:var(--mute)}
</style>
</head>
<body>
<form class="card" id="f" autocomplete="on">
  <h1>SeaRover</h1>
  <p>Upstate New York nonprofits and foundations. Read-only, data as of 2026-11-24.</p>
  <label for="pw">Passcode</label>
  <input type="password" id="pw" autocomplete="current-password" required autofocus>
  <div class="row"><input type="checkbox" id="rem"><label for="rem" style="margin:0;font-weight:400">Remember on this device</label></div>
  <button id="go">Open</button>
  <div id="msg"></div>
</form>
<script>
(function(){
const ROUNDS=600000, KEY="searover-pass";
const f=document.getElementById("f"),pw=document.getElementById("pw"),rem=document.getElementById("rem"),
      go=document.getElementById("go"),msg=document.getElementById("msg");
const say=(t,ok)=>{msg.textContent=t;msg.className=ok?"ok":""};
let blob=null;
function getBlob(){
  if(!blob)blob=fetch("app.enc",{cache:"no-cache"}).then(r=>{if(!r.ok)throw new Error("load");return r.arrayBuffer()});
  return blob;
}
async function unlock(pass,remember){
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){say("This browser is too old to open SeaRover. Please update it.");return}
  go.disabled=true;say("Opening…",true);
  try{
    const buf=new Uint8Array(await getBlob());
    if(String.fromCharCode(...buf.slice(0,4))!=="SRV1")throw new Error("format");
    const salt=buf.slice(4,20),iv=buf.slice(20,32),ct=buf.slice(32);
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ROUNDS,hash:"SHA-256"},base,
                                            {name:"AES-GCM",length:256},false,["decrypt"]);
    let plain;
    try{plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct)}
    catch(e){try{localStorage.removeItem(KEY)}catch(_){}
             say("That passcode didn't work.");go.disabled=false;pw.select();return}
    const html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    try{remember?localStorage.setItem(KEY,pass):localStorage.removeItem(KEY)}catch(_){}
    document.open();document.write(html);document.close();
  }catch(e){
    say(e.message==="load"?"Couldn't load the data. Check your connection and try again.":"Something went wrong opening SeaRover.");
    go.disabled=false;
  }
}
f.addEventListener("submit",e=>{e.preventDefault();if(pw.value)unlock(pw.value,rem.checked)});
let saved=null;try{saved=localStorage.getItem(KEY)}catch(_){}
if(saved){rem.checked=true;unlock(saved,true)}else getBlob().catch(()=>{});
})();
</script>
</body>
</html>
